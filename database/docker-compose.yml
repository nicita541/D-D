services:
  postgres:
    build: .
    container_name: dnd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dnd
      POSTGRES_USER: dnd_user
      POSTGRES_PASSWORD: dnd_password
    ports:
      - "5432:5432"
    volumes:
      - dnd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd_user -d dnd"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dnd_postgres_data:
