services:
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: dnd-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dnd}
      POSTGRES_USER: ${POSTGRES_USER:-dnd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnd_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrations:
    image: postgres:16-alpine
    container_name: dnd-migrations
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dnd}
      POSTGRES_USER: ${POSTGRES_USER:-dnd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnd_password}
    volumes:
      - ./database:/migrations:ro
    entrypoint: ["/bin/sh", "/migrations/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  llm:
    image: ollama/ollama:latest
    container_name: dnd-llm
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "ollama serve &
      OLLAMA_PID=$$!;
      until ollama list >/dev/null 2>&1; do sleep 2; done;
      if ! ollama show "$${OLLAMA_MODEL}" >/dev/null 2>&1; then
        ollama pull "$${OLLAMA_MODEL}";
      fi;
      wait $$OLLAMA_PID"
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$${OLLAMA_MODEL}\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: backend/Dockerfile
    container_name: dnd-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DndDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-dnd};Username=${POSTGRES_USER:-dnd_user};Password=${POSTGRES_PASSWORD:-dnd_password}

      Jwt__Issuer: DndBackend
      Jwt__Audience: DndClient
      Jwt__Secret: ${JWT_SECRET:-DEV_ONLY_SUPER_SECRET_KEY_CHANGE_ME_1234567890}
      Jwt__AccessTokenMinutes: 30
      Jwt__RefreshTokenDays: 30

      Ollama__BaseUrl: http://llm:11434
      Ollama__Model: ${OLLAMA_MODEL:-qwen2.5:7b}
      Ollama__TimeoutSeconds: 180
    depends_on:
      migrations:
        condition: service_completed_successfully
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/db"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dnd-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  ollama_data:
  postgres_data:
